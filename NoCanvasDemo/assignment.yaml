# =============================================================================
# Athina Assignment Configuration — No-Canvas / Database Mode
# =============================================================================
#
# This configuration is for running Athina WITHOUT a Canvas LMS.
# Submissions come from the database (managed by athina-web or --import),
# and grades are posted as GitLab issues.
#
# course_id and assignment_id are auto-generated by athina-web from the
# Django model PKs — you do NOT need to set them manually in this mode.
#
# Usage:
#   1. Import submissions:
#      athina-cli -c assignment.yaml -i submissions.json -v
#
#   2. Or run in service mode (submissions already in DB from athina-web):
#      athina-cli -j http://your-athina-web/assignments/api/ -s -v
#
# =============================================================================

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ INPUT/OUTPUT MODE                                                          │
# │ These control how Athina fetches submissions and posts grades.             │
# │ Relevant to: ALL setups                                                   │
# └─────────────────────────────────────────────────────────────────────────────┘

# 'canvas' — fetch from Canvas LMS API (requires course_id + assignment_id below)
# 'db'     — read from the local database (no Canvas API; IDs auto-generated)
input_method: db

# 'canvas'        — post grades to Canvas LMS (requires course_id + assignment_id)
# 'gitlab_issues' — create GitLab issues with grades/feedback
output_method: gitlab_issues

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ CANVAS LMS SETTINGS                                                       │
# │ Required when input_method or output_method is 'canvas'.                  │
# │ course_id and assignment_id are MANDATORY for Canvas mode — they tell     │
# │ Athina which course and assignment to interact with on Canvas.            │
# │ Find them in the Canvas URL: .../courses/<course_id>/assignments/<id>     │
# └─────────────────────────────────────────────────────────────────────────────┘

auth_token: ""
canvas_url: www.instructure.com
# course_id: 0        # REQUIRED for canvas mode — numeric Canvas course ID
# assignment_id: 0    # REQUIRED for canvas mode — numeric Canvas assignment ID

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ GITLAB ISSUES OUTPUT                                                      │
# │ Required when output_method is 'gitlab_issues'.                           │
# └─────────────────────────────────────────────────────────────────────────────┘

# Numeric GitLab project ID where grade issues will be created.
# Find this in your GitLab project's Settings > General page.
gitlab_project_id: 0

# If true, grade issues are visible only to project members (confidential).
gitlab_issues_confidential: true

# Title prefix for each grade issue, e.g., "Grade: John Doe"
gitlab_issues_title_prefix: "Grade:"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ GIT CREDENTIALS                                                           │
# │ NOT stored in YAML. Credentials live in the faculty member's Athina Web  │
# │ profile and are written to a .env file in the assignment directory.       │
# │ The grading engine reads from the .env file directly (no network call).   │
# │ The .env file is auto-generated and protected by filesystem permissions.  │
# └─────────────────────────────────────────────────────────────────────────────┘

git_url: gitlab.com

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ TEST SCRIPTS                                                              │
# │ Required for ALL setups. Each script's last output line must be a          │
# │ numeric score (0–100). Scripts receive two CLI args:                       │
# │   1. student code directory                                                │
# │   2. tests directory                                                      │
# └─────────────────────────────────────────────────────────────────────────────┘

test_scripts:
  - bash test-correctness.sh
  - bash test-clarity.sh

test_weights:
  - 0.7
  - 0.3

# Maximum points for this assignment (scores are scaled to this).
total_points: 100

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ SANDBOX & EXECUTION                                                       │
# │ Docker is always used for test isolation.                                  │
# │ A Dockerfile must be present in the assignment config directory.           │
# └─────────────────────────────────────────────────────────────────────────────┘

test_timeout: 300

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ REPOSITORY & GROUPING                                                     │
# └─────────────────────────────────────────────────────────────────────────────┘

group_assignment: false
same_url_limit: 1

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ PLAGIARISM DETECTION (CopyDetect - local)                                │
# │ Set plagiarism_publish to false to disable result publishing.             │
# └─────────────────────────────────────────────────────────────────────────────┘

plagiarism_pattern: "*.py"
copydetect_threshold: 0.33
plagiarism_publish: false
check_plagiarism_hour: 1

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ GRADE & REPORTING                                                         │
# └─────────────────────────────────────────────────────────────────────────────┘

submit_results_as_file: true
max_file_size: 1024
grade_publish: true
grade_update_frequency: 24

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ DUE DATES & MISC                                                          │
# └─────────────────────────────────────────────────────────────────────────────┘

enforce_due_date: true
print_debug_msgs: true

# For non-repo assignments (participation, quizzes), set to true.
no_repo: false

# Pass extra CLI params (student email, due date) to test scripts.
pass_extra_params: false

# Check GitLab repos for private visibility before cloning.
gitlab_check_repo_is_private: false

# Enable GitLab webhooks for push-triggered re-grading.
use_webhook: false
